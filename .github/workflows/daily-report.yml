name: Daily Work Report

on:
  schedule:
    - cron: '30 12 * * *'   # 12:30 UTC = 6:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build daily report
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          SINCE="$TODAY 00:00 +0530"
          mkdir -p reports
          FILE="reports/$TODAY.md"
          MAX_LINES=800

          COMMITS=$(git log --since="$SINCE" --format=%H -- . ':!reports')
          {
            echo "# Daily Work Report - $TODAY"
            echo
            if [ -z "$COMMITS" ]; then
              echo "No code changes were pushed today."
            else
              FIRST=$(echo "$COMMITS" | tail -1)
              BASE=$(git rev-parse "$FIRST^" 2>/dev/null || git hash-object -t tree /dev/null)

              echo "## Summary"
              echo "- Commits: $(echo "$COMMITS" | wc -l)"
              echo "- Overall change:$(git diff --shortstat $BASE HEAD -- . ':!reports')"
              echo
              echo "## Commits"
              git log --since="$SINCE" --format='- %s (%an, %h)' -- . ':!reports'
              echo
              echo "## Files changed"
              echo '```'
              git diff --stat $BASE HEAD -- . ':!reports'
              echo '```'
              echo
              echo "## Code changes (green = added, red = removed)"
              echo '```diff'
              git diff -U2 $BASE HEAD -- . ':!reports' | head -n $MAX_LINES
              echo '```'
              TOTAL=$(git diff -U2 $BASE HEAD -- . ':!reports' | wc -l)
              [ "$TOTAL" -gt "$MAX_LINES" ] && echo "_Diff truncated: showing $MAX_LINES of $TOTAL lines._"
            fi
          } > "$FILE"

      - name: Commit report
        run: |
          git config user.name "daily-report-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "chore: daily report [skip ci]"
          git push
